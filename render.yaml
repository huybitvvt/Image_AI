services:
  - type: web
    name: image-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/image-workflow
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: image-workflow
      - key: AI_CONFIG_NAME
        value: gpt
      - key: AI_CONFIG_PROVIDER
        value: openai
      - key: AI_CONFIG_MODEL
        value: gpt-image-1
      - key: OPENAI_API_KEY
        sync: false
      - key: CACHE_MAX_BYTES
        value: "209715200"
      - key: OUTPUT_RETENTION
        value: "100"
